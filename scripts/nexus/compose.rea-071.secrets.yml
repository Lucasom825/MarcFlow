# NEXUS 071: add only when Codespaces secret exists. Never use in ordinary demo.
# Compose receives the secret from the Codespaces HOST environment (not .env.nexus-demo).
# Secret is mounted read-only as a file, not exposed in container environment variables.
services:
  app:
    secrets:
      - nexus_rea_dispatch_token
    environment:
      NEXUS_REA_DISPATCH_TOKEN_FILE: /run/secrets/nexus_rea_dispatch_token
secrets:
  nexus_rea_dispatch_token:
    environment: NEXUS_REA_DISPATCH_TOKEN
