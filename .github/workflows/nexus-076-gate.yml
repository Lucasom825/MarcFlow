name: NEXUS 076 - Memora 2 readonly metadata contract
on:
  push:
    branches: [nexus/memora2-readiness-076-20261112]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies, no postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client for local typecheck only
        run: npx --no-install prisma generate
      - name: Memora 2 adapter and prior NEXUS security tests
        run: |
          npx --no-install tsx --test scripts/nexus/test-memora2-readiness-076.ts
          npx --no-install tsx --test scripts/nexus/test-memora-contract-075.ts
          npx --no-install tsx --test scripts/nexus/test-functional-lab-074.ts
          npx --no-install tsx --test scripts/nexus/test-rea-reuse-073.ts
          npx --no-install tsx --test scripts/nexus/test-rea-run-072.ts
          npx --no-install tsx --test scripts/nexus/test-rea-general-070.ts
          npx --no-install tsx --test scripts/nexus/test-rea-csrf-071.ts
          npx --no-install tsx --test scripts/nexus/test-demo-origin-071.ts
          npx --no-install tsx --test scripts/nexus/test-rea-report-069.ts
          npx --no-install tsx --test scripts/nexus/test-public-preflight-067.ts
      - name: Demo and editor regressions
        run: |
          node --experimental-strip-types --test scripts/nexus/test-demo-policy-064.mjs
          node --test scripts/nexus/test-drawflow-converter.mjs
          node --experimental-strip-types --test scripts/nexus/test-marcflow-contract.mjs
      - name: Application typecheck
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.nexus076.temp.json <<'TSC'
          {
            "extends":"./tsconfig.json",
            "include":["next-env.d.ts","src/**/*.ts","src/**/*.tsx"],
            "exclude":["node_modules","scripts"]
          }
          TSC
          npx --no-install tsc --noEmit --pretty false --project tsconfig.nexus076.temp.json
          rm tsconfig.nexus076.temp.json
      - name: No modifications to database, endpoints or production services
        shell: bash
        run: |
          set -euo pipefail
          BASE=8bde14688fc3af2e5e287cfdd00afdda6b80c53a
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changes.txt"
          if grep -Ev '^(src/lib/nexus-memora2-readiness-076.ts|src/components/nexus/memora2-readiness-076.tsx|src/app/dashboard/nexus/rea/memora2-readiness/page.tsx|src/app/dashboard/nexus/rea/memora-contract/page.tsx|scripts/nexus/test-memora2-readiness-076.ts|scripts/nexus/NEXUS-076-MEMORA2-READINESS.md|\.github/workflows/nexus-076-gate.yml)$' "$RUNNER_TEMP/changes.txt"; then
            echo 'NEXUS076 unexpected file outside isolated adapter'; exit 1
          fi
          echo 'NEXUS076_NO_BACKEND_NO_CREDENTIAL_NO_MEMORA2_CHANGES=true'
