name: NEXUS 073 - read only functional-reuse dossier
on:
  push:
    branches: [nexus/rea-reuse-073-20261112]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Dependencies without postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client only for TS
        run: npx --no-install prisma generate
      - name: New dossier and existing REA security tests
        run: |
          npx --no-install tsx --test scripts/nexus/test-rea-reuse-073.ts
          npx --no-install tsx --test scripts/nexus/test-rea-run-072.ts
          npx --no-install tsx --test scripts/nexus/test-rea-general-070.ts
          npx --no-install tsx --test scripts/nexus/test-rea-csrf-071.ts
          npx --no-install tsx --test scripts/nexus/test-demo-origin-071.ts
          npx --no-install tsx --test scripts/nexus/test-rea-report-069.ts
          npx --no-install tsx --test scripts/nexus/test-public-preflight-067.ts
      - name: Existing demo and editor tests
        run: |
          node --experimental-strip-types --test scripts/nexus/test-demo-policy-064.mjs
          node --test scripts/nexus/test-drawflow-converter.mjs
          node --experimental-strip-types --test scripts/nexus/test-marcflow-contract.mjs
      - name: Application TypeScript check
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.nexus073.temp.json <<'TSC'
          {
            "extends":"./tsconfig.json",
            "include":["next-env.d.ts","src/**/*.ts","src/**/*.tsx"],
            "exclude":["node_modules","scripts"]
          }
          TSC
          npx --no-install tsc --noEmit --pretty false --project tsconfig.nexus073.temp.json
          rm tsconfig.nexus073.temp.json
      - name: Check protected files unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b389def1972114265a42788ed1893be74e1f840
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changes.txt"
          if grep -Ev '^(src/lib/nexus-rea-reuse-073.ts|src/components/nexus/rea-reuse-073.tsx|src/app/dashboard/nexus/rea/reuse/page.tsx|src/components/nexus/rea-run-072.tsx|scripts/nexus/test-rea-reuse-073.ts|scripts/nexus/NEXUS-073-DOSSIE.md|scripts/nexus/NEXUS-073-EXPRESS-UTILS-TRIAGE.md|\.github/workflows/nexus-073-gate.yml)$' "$RUNNER_TEMP/changes.txt"; then
            echo 'Files outside approved NEXUS073 pilot changed'; exit 1
          fi
          echo 'NEXUS073_DB_EDITOR_WHATSAPP_CREDENTIALS_UNCHANGED=true'
