name: NEXUS 070 - opt-in public REA request and traceable run
on:
  push:
    branches: [nexus/rea-general-070-20261111]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install no postinstall side effects
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prisma client for existing application types
        run: npx --no-install prisma generate
      - name: NEXUS 070 request security and status tests
        run: npx --no-install tsx --test scripts/nexus/test-rea-general-070.ts
      - name: NEXUS 069 report regression and live public GitHub
        run: |
          npx --no-install tsx --test scripts/nexus/test-rea-report-069.ts
          npx --no-install tsx scripts/nexus/prove-live-rea-report-069.ts
      - name: NEXUS 067 repository preflight regression
        run: npx --no-install tsx --test scripts/nexus/test-public-preflight-067.ts
      - name: NEXUS 064 and original editor contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/nexus/test-demo-policy-064.mjs
          node --test scripts/nexus/test-drawflow-converter.mjs
          node --experimental-strip-types --test scripts/nexus/test-marcflow-contract.mjs
      - name: Application-only TypeScript validation
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.nexus070.temp.json <<'TSC'
          {
            "extends":"./tsconfig.json",
            "include":["next-env.d.ts","src/**/*.ts","src/**/*.tsx"],
            "exclude":["node_modules","scripts"]
          }
          TSC
          npx --no-install tsc --noEmit --pretty false --project tsconfig.nexus070.temp.json
          rm tsconfig.nexus070.temp.json
          echo "NEXUS070_APP_TYPECHECK_OK=true"
      - name: Enforce scope, do not mutate editor database or workflows
        shell: bash
        run: |
          set -euo pipefail
          BASE=39b85c5d8d8d13ca1c5634212f7a5402d4505b80
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/070-changes.txt"
          if grep -Ev '^(src/lib/nexus-rea-general-070.ts|src/lib/nexus-demo-policy.ts|src/app/api/nexus/rea/(config/route.ts|request/route.ts|jobs/\[id\]/route.ts)|src/app/dashboard/nexus/rea/page.tsx|src/components/nexus/rea-070-request.tsx|src/components/dashboard/realtime-clock.tsx|scripts/nexus/test-rea-general-070.ts|scripts/nexus/NEXUS-070-REQUEST.md|\.github/workflows/nexus-070-gate.yml)$' "$RUNNER_TEMP/070-changes.txt"; then
            echo "Unexpected source changes, abort"; exit 1
          fi
          echo "NEXUS070_EDITOR_DATABASE_UNCHANGED=true"
