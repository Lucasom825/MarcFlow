name: NEXUS 071 - optional Codespaces Docker secret safely mounted
on:
  push:
    branches: [nexus/rea-secrets-071-20261111]
permissions:
  contents: read
jobs:
  security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read only checkout of experimental NEXUS branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prisma client for TypeScript test only
        run: npx --no-install prisma generate
      - name: NEXUS 071 secured dispatch and policy regression
        run: |
          npx --no-install tsx --test scripts/nexus/test-demo-origin-071.ts
          npx --no-install tsx --test scripts/nexus/test-rea-general-070.ts
          npx --no-install tsx --test scripts/nexus/test-rea-report-069.ts
          npx --no-install tsx --test scripts/nexus/test-public-preflight-067.ts
      - name: Existing editor, read-only demo and conversion regressions
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/nexus/test-demo-policy-064.mjs
          node --test scripts/nexus/test-drawflow-converter.mjs
          node --experimental-strip-types --test scripts/nexus/test-marcflow-contract.mjs
      - name: Validate both Docker configurations WITHOUT any secret value
        shell: bash
        env:
          MYSQL_PASSWORD: test-only-synthetic
          MYSQL_ROOT_PASSWORD: test-only-synthetic
          AUTH_SECRET: test-only-synthetic
          NEXUS_DEMO_PASSWORD: test-only-synthetic
          NEXUS_REA_DISPATCH_TOKEN: test-only-synthetic
          NEXUS_DEMO_ORIGIN: https://nexus-ci-39164.app.github.dev
        run: |
          set -euo pipefail
          bash -n scripts/nexus/start-codespace-066.sh
          docker compose -f scripts/nexus/compose.demo-064.yml config --quiet
          docker compose -f scripts/nexus/compose.demo-064.yml -f scripts/nexus/compose.rea-071.secrets.yml config --quiet
          grep -Fq '/run/secrets/nexus_rea_dispatch_token' scripts/nexus/compose.rea-071.secrets.yml
          grep -Fq 'NEXUS_REA_DISPATCH_TOKEN_FILE' src/lib/nexus-rea-general-070.ts
          grep -Fq 'NEXUS_REA_ALLOWED_ORIGIN' scripts/nexus/compose.rea-071.secrets.yml
          echo 'NEXUS071_COMPOSE_WITH_AND_WITHOUT_SECRET_OK=true'
      - name: Actual application TypeScript check excluding historic scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.nexus071.temp.json <<'TSC'
          {
            "extends":"./tsconfig.json",
            "include":["next-env.d.ts","src/**/*.ts","src/**/*.tsx"],
            "exclude":["node_modules","scripts"]
          }
          TSC
          npx --no-install tsc --noEmit --pretty false --project tsconfig.nexus071.temp.json
          rm tsconfig.nexus071.temp.json
          echo 'NEXUS071_APP_TYPES_OK=true'
      - name: Guard unchanged editor, DB, WhatsApp and existing demo
        shell: bash
        run: |
          set -euo pipefail
          BASE=74c3e357aa54496872259f04d6fdb8f46bdf1e67
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changes.txt"
          if grep -Ev '^(scripts/nexus/compose.rea-071.secrets.yml|scripts/nexus/start-codespace-066.sh|src/lib/nexus-rea-general-070.ts|src/lib/nexus-rea-demo-origin.ts|src/app/api/nexus/rea/request/route.ts|src/components/nexus/rea-070-request.tsx|scripts/nexus/test-demo-origin-071.ts|scripts/nexus/test-rea-general-070.ts|scripts/nexus/NEXUS-071-CODESPACES-SECRET.md|\.github/workflows/nexus-071-secret-gate.yml)$' "$RUNNER_TEMP/changes.txt"; then
            echo 'Unexpected source modification'; exit 1
          fi
          echo 'NEXUS071_DB_EDITOR_MAIN_UNCHANGED=true'
